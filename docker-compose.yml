services:
  server:
    build: .
    command: npm run server
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build: .
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - server